<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>レシート</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --text:#222; --sub:#888; --line:#eee; --accent:#2f7d5b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Hiragino Sans",sans-serif; }
  .app { max-width:560px; margin:0 auto; min-height:100vh; padding-bottom:96px; }
  header { padding:20px 16px 8px; }
  h1 { font-size:18px; margin:0; }
  .month { color:var(--sub); font-size:13px; margin-top:4px; }
  .month b { color:var(--text); font-size:20px; margin-left:6px; }
  .search { margin:8px 16px; width:calc(100% - 32px); padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:15px; background:var(--card); }
  .day { padding:14px 16px 4px; color:var(--sub); font-size:12px; }
  .row { display:flex; justify-content:space-between; align-items:center; background:var(--card); padding:14px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .row .store { font-size:15px; }
  .row .cat { font-size:12px; color:var(--sub); margin-top:2px; }
  .row .amt { font-size:16px; font-variant-numeric:tabular-nums; }
  .empty { text-align:center; color:var(--sub); padding:60px 16px; font-size:14px; }
  .fab { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom)); background:var(--accent); color:#fff; border:0; border-radius:28px; padding:16px 36px; font-size:16px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.15); }
  .screen { display:none; } .screen.on { display:block; }
  .bar { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; }
  .link { background:none; border:0; color:var(--accent); font-size:15px; cursor:pointer; padding:4px; }
  .link.del { color:#b3443b; }
  .box { background:var(--card); margin:8px 0; }
  .big { padding:16px; border-bottom:1px solid var(--line); }
  .big label, .item label { display:block; font-size:11px; color:var(--sub); margin-bottom:2px; }
  .big input { width:100%; border:0; font-size:17px; padding:2px 0; background:transparent; outline:none; }
  .big input.total { font-size:28px; }
  .item { display:grid; grid-template-columns:1fr 90px; gap:6px 10px; padding:12px 16px; border-bottom:1px solid var(--line); }
  .item input, .item select { border:0; background:transparent; font-size:15px; padding:2px 0; width:100%; outline:none; }
  .item input.price { text-align:right; }
  .item select { color:var(--sub); font-size:13px; }
  .item .x { grid-column:2; grid-row:2; text-align:right; color:#b3443b; font-size:12px; background:none; border:0; cursor:pointer; }
  .warn { margin:8px 16px; font-size:12px; color:#b3443b; }
  .thumb { width:100%; max-height:200px; object-fit:contain; background:#222; display:block; }
  .note { margin:8px 16px; font-size:12px; color:var(--sub); }
  .save { display:block; width:calc(100% - 32px); margin:16px; padding:15px; background:var(--accent); color:#fff; border:0; border-radius:12px; font-size:16px; cursor:pointer; }
</style>
</head>
<body>
<div class="app">

  <!-- 一覧 -->
  <section id="list" class="screen on">
    <header>
      <h1>レシート</h1>
      <div class="month"><span id="monthLabel"></span><b id="monthTotal"></b></div>
    </header>
    <input class="search" id="q" type="search" placeholder="店名・商品名で探す">
    <div id="rows"></div>
    <button class="fab" id="snap">レシートを撮る</button>
    <input type="file" id="file" accept="image/*" capture="environment" hidden>
  </section>

  <!-- 確認 -->
  <section id="edit" class="screen">
    <div class="bar">
      <button class="link" id="cancel">やめる</button>
      <button class="link del" id="remove" hidden>削除</button>
    </div>
    <img id="thumb" class="thumb" alt="" hidden>
    <div class="box">
      <div class="big"><label>店名</label><input id="eStore"></div>
      <div class="big"><label>日付</label><input id="eDate" type="date"></div>
      <div class="big"><label>合計(円)</label><input id="eTotal" class="total" type="number" inputmode="numeric"></div>
    </div>
    <div class="warn" id="warn" hidden></div>
    <div class="box" id="items"></div>
    <div class="note" id="note"></div>
    <button class="save" id="save">保存</button>
  </section>

</div>

<script>
const CATS = ["食費","日用品","外食","交通","衣類","医療","その他"];
// 商品名→ジャンル。直したジャンルは learned に覚えて、次から使う。
const GUESS = [["牛乳","食費"],["パン","食費"],["卵","食費"],["米","食費"],["野菜","食費"],["洗剤","日用品"],["ティッシュ","日用品"],["シャンプー","日用品"],["薬","医療"]];
const KEY = "receipts.v1", LKEY = "learned.v1";
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
let receipts = load(KEY, null);
let learned = load(LKEY, {});
if (!receipts) {
  receipts = [
    { id:1, store:"サンプルマート", date:today(0), total:582, items:[{n:"牛乳",p:198,c:"食費"},{n:"食パン",p:158,c:"食費"},{n:"洗剤",p:226,c:"日用品"}] },
    { id:2, store:"サンプルドラッグ", date:today(-3), total:980, items:[{n:"ティッシュ",p:480,c:"日用品"},{n:"シャンプー",p:500,c:"日用品"}] },
  ];
  persist();
}
function today(offset){ const d=new Date(); d.setDate(d.getDate()+offset); return d.toISOString().slice(0,10); }
function persist(){ localStorage.setItem(KEY, JSON.stringify(receipts)); localStorage.setItem(LKEY, JSON.stringify(learned)); }
const $ = id => document.getElementById(id);
const yen = n => "¥" + Number(n||0).toLocaleString();
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on", s.id===id)); window.scrollTo(0,0); }
function guess(name){ if (learned[name]) return learned[name]; const g = GUESS.find(([k])=>name.includes(k)); return g ? g[1] : "その他"; }
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---- 一覧 ----
function renderList(){
  const q = $("q").value.trim();
  const list = receipts.filter(r => !q || r.store.includes(q) || r.items.some(i=>i.n.includes(q)))
                       .sort((a,b)=> b.date.localeCompare(a.date) || b.id-a.id);
  const ym = today(0).slice(0,7);
  $("monthLabel").textContent = ym.replace("-","年")+"月の支出";
  $("monthTotal").textContent = yen(receipts.filter(r=>r.date.startsWith(ym)).reduce((s,r)=>s+r.total,0));
  if (!list.length) { $("rows").innerHTML = '<div class="empty">'+(q?"見つかりませんでした":"まだレシートがありません")+'</div>'; return; }
  let html = "", last = "";
  for (const r of list) {
    if (r.date !== last) { html += '<div class="day">'+fmtDay(r.date)+'</div>'; last = r.date; }
    const cats = [...new Set(r.items.map(i=>i.c))].join("・");
    html += '<div class="row" data-id="'+r.id+'"><div><div class="store">'+esc(r.store)+'</div><div class="cat">'+esc(cats)+'</div></div><div class="amt">'+yen(r.total)+'</div></div>';
  }
  $("rows").innerHTML = html;
}
function fmtDay(s){ const d=new Date(s+"T00:00"); return (d.getMonth()+1)+"月"+d.getDate()+"日("+"日月火水木金土"[d.getDay()]+")"; }
$("q").addEventListener("input", renderList);
$("rows").addEventListener("click", e => { const row = e.target.closest(".row"); if (row) openEdit(receipts.find(r=>r.id==row.dataset.id)); });

// ---- 撮影(お試し版: 読み取りはまだ。サンプル結果を出す) ----
$("snap").onclick = () => $("file").click();
$("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const url = URL.createObjectURL(f);
  const items = [{n:"牛乳",p:198},{n:"食パン",p:158},{n:"洗剤",p:226}].map(i=>({...i,c:guess(i.n)}));
  openEdit({ id:null, store:"(読み取り結果の例)ストア", date:today(0), total:582, items }, url);
  e.target.value = "";
};

// ---- 確認 ----
let cur = null;
function openEdit(r, img){
  cur = JSON.parse(JSON.stringify(r));
  $("eStore").value = cur.store; $("eDate").value = cur.date; $("eTotal").value = cur.total;
  $("thumb").hidden = !img; if (img) $("thumb").src = img;
  $("remove").hidden = cur.id === null;
  $("note").textContent = cur.id === null ? "※お試し版: 読み取りはまだ入っていません。これはサンプルの結果です。" : "";
  $("save").textContent = cur.id === null ? "保存" : "変更を保存";
  renderItems(); show("edit");
}
function renderItems(){
  $("items").innerHTML = cur.items.map((it,i)=>
    '<div class="item"><div><label>商品名</label><input data-i="'+i+'" data-f="n" value="'+esc(it.n)+'"></div>'+
    '<div><label>金額</label><input class="price" data-i="'+i+'" data-f="p" type="number" inputmode="numeric" value="'+it.p+'"></div>'+
    '<select data-i="'+i+'" data-f="c">'+CATS.map(c=>'<option'+(c===it.c?' selected':'')+'>'+c+'</option>').join("")+'</select>'+
    '<button class="x" data-del="'+i+'">消す</button></div>').join("");
  checkTotal();
}
function checkTotal(){
  const sum = cur.items.reduce((s,i)=>s+Number(i.p||0),0), total = Number($("eTotal").value||0);
  $("warn").hidden = sum === total;
  $("warn").textContent = "明細の合計("+yen(sum)+")と、合計金額("+yen(total)+")が合っていません。";
}
$("eTotal").addEventListener("input", checkTotal);
$("items").addEventListener("input", e => {
  const t = e.target, i = t.dataset.i; if (i===undefined) return;
  cur.items[i][t.dataset.f] = t.dataset.f==="p" ? Number(t.value) : t.value;
  if (t.dataset.f==="c") learned[cur.items[i].n] = t.value;  // 直したジャンルを覚える
  if (t.dataset.f==="p") checkTotal();
});
$("items").addEventListener("click", e => { const d = e.target.dataset.del; if (d!==undefined){ cur.items.splice(d,1); renderItems(); } });
$("cancel").onclick = () => show("list");
$("remove").onclick = () => { if (confirm("このレシートを削除しますか?")) { receipts = receipts.filter(r=>r.id!==cur.id); persist(); renderList(); show("list"); } };
$("save").onclick = () => {
  cur.store = $("eStore").value.trim() || "(店名なし)"; cur.date = $("eDate").value || today(0); cur.total = Number($("eTotal").value||0);
  if (cur.id === null) { cur.id = Date.now(); receipts.push(cur); }
  else receipts = receipts.map(r=>r.id===cur.id ? cur : r);
  persist(); renderList(); show("list");
};

renderList();
</script>
</body>
</html>
